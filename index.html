<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body
        {
            height: 100vh;
            background: url("cofee.jpg")no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container
        {
            text-align: center;
            color: white;
            background-color: rgba(0,0,0,0.45);
            padding: 40px;
            border-radius: 20px;
        }
        h1
        {
            font-size: 45px;
            margin-bottom: 15px;
        }
        p{
            font-size: 18px;
            margin-bottom: 35px;
        }
        button
        {
            width: 220px;
            height: 55px;
            border: none;
            border-radius: 30px;
            background: #8B4513;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 3s;
        }
        button:hover
        {
            background: #5c3317;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <h1>Coffee Shop</h1>
        <p>Enjoy the best coffee in town</p>
        <button onclick="nextPage()">Get Started</button>
    </div>
    <script>
        function nextPage()
        {
            window.location.href="login.html";
        }
    </script>
    
</body>
</html>
