<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee   Home</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body
        {
            background: #F5F5F5;
            display: flex;
            justify-content: center;
        }
        .container
        {
            width: 390px;
            background: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header
        {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo
        {
            font-size: 40px;
            color: #7B4B2A;
        }
        .profile
        {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        h1
        {
            margin-top: 15px;
            font-size: 45px;
            color: #222;
        }
        .search
        {
            margin-top: 25px;
        }
        .search input
        {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background:#E8DCCB ;
            font-size: 20px;
            outline: none;
        }
        .categories
        {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        .categories button
        {
            width: 110px;
            height: 55px;
            border: none;
            border-radius: 15px;
            background:#ECE8DF ;
            font-size: 16px;
            cursor: pointer;
        }
        .categories.button:hover
        {
            background: #7B4B2A;
            color: white;
        }
        .products
        {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        .card
        {
            width: 165px;
            background: #F2EEE7;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0.15);
        }
        .card img
        {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .info
        {
            padding: 10px;
        }
        .info h3
        {
            font-size: 18px;
        }
        .info p
        {
            color: #666;
            margin-top: 4px;
        }
        .row
        {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-weight: bold;
        }
        .add
        {
            width: 35px;
            height: 35px;
            border: none;
            background: #7B4B2A;
            color: white;
            border-radius: 8px;
            font-size: 22px;
            cursor: pointer;
            margin: 12px auto;
            display: block;
        }
        .add:hover
        {
            background: #5A3218;
        }
    </style>
</head>
<body>  
    <div class="container">
        <div class="header">
            <div class="login"></div>
            <img src="profile.png" class="profile">
        </div>
        <h1>Hi Karthikeyan,</h1>
        <div class="search">
            <input type="text" placeholder="find your best coffee">
        </div>
        <div class="categories">
            <button>Cappuccino</button>
            <button>American</button>
            <button>Expresso</button>
        </div>
        <div class="products">
            <div class="card">
                <img src="coffee1.png">
                <div class="info">
                    <h3>Cappuccino</h3>
                    <p>With Oat Milk</p>
                    <div class="row">
                        <span>⭐4.5</span>
                        <span>$3.80</span>
                    </div>
                    <button class="add" onclick="product()">+</button>
                </div>
                        </div>
                        <div class="card">
                           <img src="coffee2.png">
                           <div class="info">
                            <h3>Cappuccino</h3>
                            <p>With Milk</p>
                            <div class="row">
                                <span>⭐4.5</span>
                                <span>$3.00</span>
                            </div>
                            <button class="add" onclick="product()">+</button>
                      </div>
        </div>
    </div>
    <script>
        function product()
        {
            window.location.href="product.html";
        }
    </script>
    </div>


    
</body>
</html>
