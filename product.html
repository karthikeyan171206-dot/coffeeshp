<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body
{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
}
.container
{
    width:390px;
    min-height:100vh;
    background:#fff;
}
.image-section
{
    position:relative;
}
.image-section img
{
    width:100%;
    height:360px;
    object-fit:cover;
    border-bottom-left-radius:25px;
    border-bottom-right-radius:25px;
}
.back
{
    position:absolute;
    top:20px;
    left:20px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-size:22px;
}
.profile
{
    position:absolute;
    top:20px;
    right:20px;
    width:45px;
    height:45px;
    border-radius:50%;
}
.content
{
    padding:20px;
}
.top
{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.left h2
{
    font-size:30px;
}
.left p
{
    color:gray;
    margin-top:5px;
}
.right
{
    text-align:right;
}
.rating
{
    color:#8B4513;
    font-size:18px;
    font-weight:bold;
}
.price
{
    font-size:25px;
    font-weight:bold;
    margin-top:10px;
}
.plus
{
    width:35px;
    height:35px;
    border:none;
    background:#8B4513;
    color:white;
    border-radius:10px;
    font-size:22px;
    margin-top:10px;
    cursor:pointer;
}
.size
{
    margin-top:30px;
}
.size h3
{
    margin-bottom:15px;
}
.size-buttons
{
    display:flex;
    justify-content:space-between;
}
.size-buttons button
{
    width:65px;
    height:40px;
    border:2px solid #ccc;
    border-radius:20px;
    background:white;
    cursor:pointer;
    font-size:18px;
}
.description
{
    margin-top:30px;
}
.description h3
{
    margin-bottom:10px;
}
.description p
{
    color:#666;
    line-height:24px;
}
.order
{
    margin-top:40px;
    text-align:center;
}
.order button
{
    width:250px;
    height:50px;
    border:none;
    border-radius:30px;
    background:#8B4513;
    color:white;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>
<body>
<div class="container">
<div class="image-section">
<div class="back" onclick="history.back()">❮</div>
<img src="coffee2.png" alt="Coffee">
<img src="profile.jpg" class="profile">
</div>
<div class="content">
<div class="top">
<div class="left">
<h2>Cappuccino</h2>
<p>With Oat Milk</p>
</div>
<div class="right">
<div class="rating">⭐ 4.5</div>
<div class="price">$3.80</div>
<button class="plus">+</button>
</div>
</div>
<div class="size">
<h3>Size</h3>
<div class="size-buttons">
<button onclick="selectSize(this)">S</button>
<button onclick="selectSize(this)">M</button>
<button onclick="selectSize(this)">L</button>
<button onclick="selectSize(this)">XL</button>
</div>
</div>
<div class="description">
<h3>Description</h3>
<p>
Freshly brewed cappuccino made with premium coffee beans and creamy oat milk.
Enjoy a rich aroma, smooth texture, and delicious taste in every sip.
</p>
</div>
<div class="order">
<button onclick="placeOrder()">Place Order</button>
</div>
</div>
<script>
 function selectSize(button)
 {
    let buttons = document.querySelectorAll(".size-buttons button");
    buttons.forEach(function(btn){
        btn.style.background = "white";
        btn.style.color = "black";
        btn.style.border = "2px solid #ccc";
    });
    button.style.background = "#8B4513";
    button.style.color = "white";
    button.style.border = "2px solid #8B4513";
}
let quantity = 1;
document.querySelector(".plus").addEventListener("click", function(){
    quantity++;
    alert("Quantity : " + quantity);
});
function placeOrder(){
    alert("Order Added Successfully!");
    window.location.href = "review.html";
}
</script>
</body>
</html>
