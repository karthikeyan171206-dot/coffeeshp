<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body
        {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container
        {
            width: 390px;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .success
        {
            width: 120px;
            height: 120px;
            background:#4CAF50;
            color: white;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
        }
        img{
            width: 180px;
            margin:20px;
        }
        h1
        {
            color: #8B4513;
            margin-bottom: 15px;
        }
        p
        {
            font-size: 18px;
            color: #666;
            line-height:28px;
            margin-bottom: 30px;
        }
        button
        {
            width: 220px;
            height: 50px;
            border: none;
            border-radius: 30px;
            background: #8B4513;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        button:hover
        {
            background:#5A3218
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon"></div>
        <img src="coffee2.png" alt="Coffee">
        <p>Thank you for your order.<br>
        Your delicious Coffee is being Prepared<br>
    Have a grat day </p>
    <button onclick="goHome()">Back to Home</button>
    </div>
    <script>
        function goHome()
        {
            alert("Welcome Back!");
            window.location.href="home.html"
        }
    </script>
    
</body>
</html>
